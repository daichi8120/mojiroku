[package]
name = "mojiroku-llm"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "mojiroku ローカル要約 sidecar（llama.cpp/Metal）。whisper との ggml 衝突回避のため別バイナリ。ADR-0007。"

[[bin]]
name = "mojiroku-llm"
path = "src/main.rs"

[dependencies]
# llama.cpp（Metal）。whisper を含む本体とは別バイナリなので ggml 衝突しない。
llama-cpp-2 = { version = "0.1.150", features = ["metal"] }
