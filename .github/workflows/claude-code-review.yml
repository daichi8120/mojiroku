# 自分が出した PR を Claude に自動レビューさせる。
#
# 出典: https://code.claude.com/docs/en/github-actions の "Run a skill"（Code Review）。
# 公式例に対して、このリポジトリの事情から4点を追加している:
#   1. fork PR を除外する job レベルの if:（後述）
#   2. concurrency — 連続 push でレビューが積み上がるのを防ぐ（サブスク枠の節約）
#   3. timeout-minutes — CLAUDE.md が大きいので暴走を止める
#   4. --model — 既定（実測では claude-sonnet-5）ではなく Opus 5 を使う
#
# ⚠️ --max-turns は入れないこと。公式例には無く、2026-08-22 に 30 を入れたところ
#    小さな PR（2ファイル）でも上限に到達してジョブが落ちた。暴走の歯止めは
#    timeout-minutes 側で足りる。
#
# ⚠️ 除外は必ず job レベルの if: で書くこと。ワークフローレベルの paths:/branches:
#    フィルタでスキップすると、将来これを required status check にしたときに
#    PR が "Waiting for status to be reported" で永久にブロックされる。
#    job レベルの if: でスキップされた job は success 扱いになる。
#
# ⚠️ pull_request_target は使わない。fork のコードを base の secrets 付きで動かすことになり、
#    「fork PR から secrets に到達する経路が無い」という本リポジトリの性質を壊す。
#
# ℹ️ run が success でもコメントが 0 件のことがある。**壊れているとは限らない。**
#    公式ドキュメントによると Claude は次を意図的に飛ばす:
#    draft / closed の PR、レビュー不要と判断した PR（自動生成や些細なもの）、
#    既に Claude のコメントが付いている PR。
#    実際に壊れているかは run のログの `permission_denials_count` を見る
#    （0 でなければツールが拒否されている＝設定の問題）。

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じ PR への連続 push では、古いレビューを打ち切って最新だけ残す。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork からの PR ではジョブごとスキップする。
    # 書かないと action の actor 権限チェックで fail し、外部 PR のたびに赤い × が付く
    # （GitHub は fork PR に secrets を渡さないので、走らせても成功しない）。
    # なおこの書き方は GitHub 標準のイディオムで、Anthropic 公式例には無い。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # Claude GitHub App の OIDC 認証に必須
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # サブスクリプション（Max）のトークンを使う。API 従量課金は発生しない。
          # 発行は `claude setup-token`（有効期間1年）。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --comment が無いと PR に何も投稿されず、結果は run のログにしか出ない。
          #
          # --allowedTools は**公式例どおり MCP ツール 1 つだけ**にする。
          # 公式ドキュメント（code.claude.com/docs/en/github-actions の "Run a skill"）が
          # 理由を書いている:
          #   - この 1 行が要るのは、inline comment を投稿する MCP サーバーを action が
          #     起動する条件が「--allowedTools がそれを名指ししていること」だから
          #   - **skill を呼ぶ場合、それ以外のツールは skill 自身の allowed-tools
          #     frontmatter が与える**（"Claude can use the tools its allowed-tools
          #     frontmatter grants"）
          #
          # ⚠️ 2026-08-22 に Bash(gh …) を列挙する形へ広げたが、公式の想定と違う形だった。
          #    2026-08-29 の #46 の run は success かつ permission_denials_count: 1 で、
          #    5 ターンで終わりコメントを投稿しなかった。公式例へ戻す。
          # --model: 明示しないと Claude Code の既定（実測では claude-sonnet-5）になる。
          #   2026-08-30 に Opus 5 へ引き上げた。docs のみの PR でも事実誤認を 2 件突いた
          #   実績が Sonnet にもあるが、コード変更のレビューではより深く見てほしいため。
          #   ⚠️ サブスク枠の消費は増える（Sonnet の実測で 1 run あたり $2.49 相当・20 ターン・約 8 分）。
          #   重すぎると感じたら claude-sonnet-5 へ戻す。
          # --allowedTools: 公式例どおり MCP ツール 1 つだけ（理由は上の 2 ブロック）。
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment" 
